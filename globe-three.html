<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Globus (Three.js) — A/B-Vergleich · SolarSpeculations</title>
<!--
  Eigenständige Vergleichs-Szene: der Scene-1-Globus in Three.js nachgebaut (Tag/Nacht +
  Stadtlichter, Ozean-Glanz, Normal-Map-Relief, prozedurale Wolken, Atmosphäre).
  KEIN Build-Step: Three.js via <script type="importmap"> aus dem lokal gevendorten lib/.
  Greift NICHT in index.html / app.js ein. Texturen aus assets/images/entities/scene1/.
  Autor: Chant1.
-->
<style>
  html,body{margin:0;height:100%;background:#05060b;color:#cfd3da;
    font-family:"Iowan Old Style",Georgia,serif;overflow:hidden;}
  #c{position:fixed;inset:0;display:block;}
  #hud{position:fixed;left:14px;top:12px;z-index:10;font-size:13px;line-height:1.5;
    letter-spacing:.02em;color:#aeb4bf;text-shadow:0 1px 2px #000;pointer-events:none;}
  #hud b{color:#eef1f5;font-weight:600;}
  #fps{color:#7fd6a0;}
  #hint{position:fixed;right:14px;bottom:12px;z-index:10;font-size:12px;color:#8b919c;
    letter-spacing:.06em;text-transform:uppercase;}
  .err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:2rem;color:#e7b0b0;}
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div><b>Globus · Three.js</b> (Vergleich zum p5-Globus)</div>
    <div>FPS: <span id="fps">–</span> · <span id="pd">–</span></div>
    <div id="cnt">lädt …</div>
  </div>
  <div id="hint">ziehen = drehen · Rad = zoom</div>

  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three.module.js",
      "three/addons/controls/OrbitControls.js": "./lib/OrbitControls.js"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const TEX = 'assets/images/entities/scene1/';
  const fpsEl = document.getElementById('fps');
  const cntEl = document.getElementById('cnt');
  document.getElementById('pd').textContent = 'pixelRatio ' + Math.min(window.devicePixelRatio||1,1.5).toFixed(2);

  // ---------- Renderer / Szene / Kamera ----------
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.5));   // fairer Vergleich + Perf
  renderer.setSize(innerWidth, innerHeight);
  // KEIN Output-Encoding: der p5-Globus arbeitet farb-unmanaged (rohe Textur-Werte rein, roh raus).
  // Mit SRGB-Output wuerde Three die (bereits sRGB-) Texturen ein zweites Mal encodieren -> zu dunkel.
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0, 0.25, 4.3);   // ganzer Globus im Blick (mit etwas Raum drumherum)

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 1.6; controls.maxDistance = 7; controls.enablePan = false;

  // ---------- Sonnenrichtung (Welt) — leicht frontal, wie im p5-Globus ----------
  const sunDir = new THREE.Vector3(0.55, 0.30, 0.78).normalize();

  // ---------- Texturen ----------
  const loader = new THREE.TextureLoader();
  const load = (file) => new Promise(res => loader.load(TEX+file, t => {
    t.colorSpace = THREE.NoColorSpace;   // roh sampeln (wie p5) -> Farb-Parität zum p5-Globus
    t.wrapS = THREE.RepeatWrapping; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    res(t);
  }, undefined, () => res(null)));

  // ---------- Erd-Shader (Port von SURF_FRAG + Stadtlichter) ----------
  const EARTH_VERT = `
    varying vec2 vUv; varying vec3 vNw; varying vec3 vWorld;
    void main(){
      vUv = uv;
      vNw = normalize(mat3(modelMatrix) * normal);     // Weltnormale (folgt der Drehung)
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`;
  const EARTH_FRAG = `
    precision highp float;
    uniform sampler2D uDay, uNormalMap, uSpec, uNight;
    uniform vec3 uSunDir, uSunCol, uNightTint, uAtmoCol;
    uniform float uRelief, uGloss, uSpecGain, uAmbient, uWaterGain, uSheen, uSheenPow, uCityGain;
    varying vec2 vUv; varying vec3 vNw; varying vec3 vWorld;
    void main(){
      vec3 N0 = normalize(vNw);
      vec3 T = normalize(cross(vec3(0.0,1.0,0.0), N0) + vec3(1e-5));   // Tangente entlang Laengengrad
      vec3 B = cross(N0, T);
      vec3 nm = texture2D(uNormalMap, vUv).rgb * 2.0 - 1.0;
      vec3 N  = normalize(N0 + (T*nm.x + B*nm.y) * uRelief);
      vec3 L  = normalize(uSunDir);
      vec3 V  = normalize(cameraPosition - vWorld);
      vec3 alb  = texture2D(uDay, vUv).rgb;
      float spec = texture2D(uSpec, vUv).r;
      alb *= mix(1.0, uWaterGain, spec);                              // Wasser heller + Struktur
      float diff = max(dot(N, L), 0.0);
      float term = smoothstep(-0.12, 0.22, dot(N0, L));               // Tag/Nacht-Kante
      vec3 H = normalize(L + V);
      float sp = pow(max(dot(N,H),0.0), uGloss) * spec * uSpecGain * term;
      vec3 dayCol = alb * (uAmbient + diff) * uSunCol + sp * uSunCol;
      vec3 city = texture2D(uNight, vUv).rgb;                         // Stadtlichter (nur Nachtseite)
      vec3 nightCol = alb * uNightTint + city * uCityGain * (1.0 - term);
      vec3 col = mix(nightCol, dayCol, term);
      float sheen = pow(max(dot(N,H),0.0), uSheenPow) * spec * term * uSheen;
      col += sheen * vec3(0.70, 0.80, 1.00);                          // breiter Wasser-Schimmer
      float fres = pow(1.0 - max(dot(N0,V),0.0), 3.0);                // Atmosphaeren-Rand
      col += uAtmoCol * fres * (0.18 + 0.82*term);
      gl_FragColor = vec4(col, 1.0);
    }`;

  // ---------- Wolken-Shader (Port von CLOUD_FRAG: prozedurales 3D-Noise, animiert) ----------
  const CLOUD_VERT = `
    varying vec3 vN0; varying vec3 vNw; varying vec3 vWorld;
    void main(){
      vN0 = normalize(position);                       // Objektnormale -> Noise dreht mit der Kugel
      vNw = normalize(mat3(modelMatrix) * normal);
      vec4 wp = modelMatrix * vec4(position,1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`;
  const CLOUD_FRAG = `
    precision highp float;
    uniform sampler2D uLandSpec; uniform vec3 uSunDir; uniform float uCloudOp, uTime;
    varying vec3 vN0; varying vec3 vNw; varying vec3 vWorld;
    float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7)))*43758.5453); }
    float vnoise(vec3 p){ vec3 i=floor(p), f=fract(p); vec3 u=f*f*(3.0-2.0*f);
      return mix(mix(mix(hash(i+vec3(0.,0.,0.)),hash(i+vec3(1.,0.,0.)),u.x),mix(hash(i+vec3(0.,1.,0.)),hash(i+vec3(1.,1.,0.)),u.x),u.y),
                 mix(mix(hash(i+vec3(0.,0.,1.)),hash(i+vec3(1.,0.,1.)),u.x),mix(hash(i+vec3(0.,1.,1.)),hash(i+vec3(1.,1.,1.)),u.x),u.y),u.z); }
    float fbm(vec3 p){ float v=0.0,a=0.5; for(int k=0;k<5;k++){ v+=a*vnoise(p); p*=2.0; a*=0.5; } return v; }
    void main(){
      vec3 N0 = normalize(vN0);
      vec3 L = normalize(uSunDir);
      vec3 Vd = normalize(cameraPosition - vWorld);
      float water = texture2D(uLandSpec, vec2(atan(N0.z,N0.x)/6.2831+0.5, asin(clamp(N0.y,-1.0,1.0))/3.14159+0.5)).r;
      float t = uTime;
      float ca = cos(t*0.010), sa = sin(t*0.010);
      vec3 d = vec3(N0.x*ca + N0.z*sa, N0.y, -N0.x*sa + N0.z*ca);      // Drift
      float base = fbm(d*2.6 + vec3(0.0, t*0.012, 0.0)) * 0.5 + 0.5;
      float det  = fbm(d*7.0 + 11.0) * 0.5 + 0.5;
      float raw = base*0.70 + det*0.30;
      float pole = 1.0 - smoothstep(0.80, 0.99, abs(N0.y));
      float lo = mix(0.82, 0.74, water);
      float a = smoothstep(lo, lo + 0.11, raw) * pole;
      a *= clamp(det*0.6 + 0.5, 0.0, 1.0);
      if(a < 0.01) discard;
      float term = smoothstep(-0.05, 0.28, dot(N0, L));
      vec3 ccol = mix(vec3(0.55,0.60,0.68), vec3(1.0), 0.3 + 0.7*term);
      float rim = smoothstep(0.0, 0.22, dot(normalize(vNw), Vd));
      float landScale = mix(0.30, 1.0, water);
      float al = a * (0.10 + 0.90*term) * rim * landScale * uCloudOp;
      gl_FragColor = vec4(ccol * al, al);                            // VORMULTIPLIZIERT
    }`;

  // ---------- Atmosphaeren-Glow (Fresnel, Rueckseite) ----------
  const ATMO_FRAG = `
    varying vec3 vNw; varying vec3 vWorld;
    uniform vec3 uAtmoCol;
    void main(){
      vec3 V = normalize(cameraPosition - vWorld);
      float i = pow(0.62 - dot(normalize(vNw), V), 3.0);
      gl_FragColor = vec4(uAtmoCol, 1.0) * clamp(i, 0.0, 1.0) * 0.55;   // dezenter (Erd-Shader hat eigenes Fresnel)
    }`;
  const ATMO_VERT = `
    varying vec3 vNw; varying vec3 vWorld;
    void main(){ vNw = normalize(mat3(modelMatrix)*normal); vec4 wp=modelMatrix*vec4(position,1.0);
      vWorld=wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`;

  const group = new THREE.Group(); scene.add(group);
  let cloudMat = null, earthMat = null;

  async function build(){
    const [day, normal, specT, night] = await Promise.all([
      load('earth_day.jpg', true), load('earth_normal.jpg', false),
      load('earth_spec.jpg', false), load('earth_night.png', true)
    ]);
    if(!day){ document.body.innerHTML = '<div class="err">earth_day.jpg nicht gefunden — über einen lokalen Server öffnen (file:// blockiert das Laden).</div>'; return; }
    cntEl.innerHTML = 'Tag/Nacht · Stadtlichter · Ozean-Glanz · Relief · prozed. Wolken · Atmosphäre';

    // Erde
    earthMat = new THREE.ShaderMaterial({
      vertexShader: EARTH_VERT, fragmentShader: EARTH_FRAG,
      uniforms: {
        uDay:{value:day}, uNormalMap:{value:normal}, uSpec:{value:specT}, uNight:{value:night||day},
        uSunDir:{value:sunDir}, uSunCol:{value:new THREE.Color(1.0,0.97,0.90)},
        uNightTint:{value:new THREE.Color(0.05,0.06,0.10)}, uAtmoCol:{value:new THREE.Color(0.42,0.60,0.95)},
        uRelief:{value:0.85}, uGloss:{value:240.0}, uSpecGain:{value:0.35}, uAmbient:{value:0.20},
        uWaterGain:{value:2.0}, uSheen:{value:0.14}, uSheenPow:{value:7.0}, uCityGain:{value:night?2.2:0.0}
      }
    });
    group.add(new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), earthMat));

    // Wolken (etwas groessere Kugel, vormultipliziertes Alpha)
    cloudMat = new THREE.ShaderMaterial({
      vertexShader: CLOUD_VERT, fragmentShader: CLOUD_FRAG,
      transparent:true, premultipliedAlpha:true, depthWrite:false,
      uniforms:{ uLandSpec:{value:specT}, uSunDir:{value:sunDir}, uCloudOp:{value:0.55}, uTime:{value:0} }
    });
    group.add(new THREE.Mesh(new THREE.SphereGeometry(1.012, 96, 64), cloudMat));

    // Atmosphaere
    const atmoMat = new THREE.ShaderMaterial({
      vertexShader: ATMO_VERT, fragmentShader: ATMO_FRAG, side: THREE.BackSide,
      transparent:true, blending: THREE.AdditiveBlending, depthWrite:false,
      uniforms:{ uAtmoCol:{value:new THREE.Color(0.30,0.55,1.0)} }
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.15, 64, 48), atmoMat));

    group.rotation.x = 0.20;   // leichte Achsneigung wie im p5-Globus
  }

  // ---------- Sterne (dezente Ambiente) ----------
  (function stars(){
    const n=600, pos=new Float32Array(n*3);
    for(let i=0;i<n;i++){ const r=40+Math.random()*30, u=Math.random()*2-1, th=Math.random()*6.2831, s=Math.sqrt(1-u*u);
      pos[i*3]=r*s*Math.cos(th); pos[i*3+1]=r*u; pos[i*3+2]=r*s*Math.sin(th); }
    const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0x9fb0c8, size:0.12, sizeAttenuation:true})));
  })();

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  let last=performance.now(), acc=0, frames=0, fps=0;
  const clock = new THREE.Clock();
  function tick(){
    const dt = clock.getDelta();
    group.rotation.y += dt * 0.10;                 // langsame Eigendrehung (wie p5 baseVel)
    if(cloudMat) cloudMat.uniforms.uTime.value = clock.elapsedTime;
    controls.update();
    renderer.render(scene, camera);
    // FPS
    frames++; const now=performance.now(); acc += now-last; last=now;
    if(acc>=500){ fps=Math.round(frames*1000/acc); fpsEl.textContent=fps; frames=0; acc=0; }
    requestAnimationFrame(tick);
  }

  build().then(()=>{ clock.start(); tick(); });
  </script>
</body>
</html>
