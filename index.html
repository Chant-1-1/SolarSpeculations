<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>SolarSpeculations</title>
<link rel="icon" href="data:," />
<style>
  /* ===== DESCENT-Designsprache: schwarz, Courier-Mono, lowercase + Letter-Spacing,
     duenne Gold-Linien auf dunklen Flaechen, Vignette, Glow-Cursor. Akzentfarbe ist
     das Smog-Gold des Projekts (statt DESCENT-Tuerkis) — passt zur Story. ===== */
  :root {
    --accent: #d8b25a;              /* Smog-Gold */
    --text: rgba(228, 222, 204, 0.92);
    --dim: #9a937f;                 /* gedimmtes Warmgrau */
    --line: rgba(216, 178, 90, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    background: #000; color: var(--dim);
    font-family: 'Courier New', ui-monospace, monospace;
    -webkit-font-smoothing: antialiased;
  }
  /* Custom-Glow-Cursor nur auf Geraeten mit echtem Hover (Desktop) */
  @media (hover: hover) { html, body, canvas { cursor: none; } }

  /* --- Schwarz-Weiss-Modus: GPU-komponierter Graustufen-Filter NUR auf dem Canvas.
         Text/UI (Menue, Reader, Gate, Cursor, Captions) bleiben bewusst UNgefiltert -> gold.
         Auf dem Canvas bleiben Sonne + Hotspots gold ueber die UNgefilterten Tint-Layer
         #sun-tint / #bw-tints (mix-blend-mode: color), die den Graustufen darunter den
         Farbton zurueckgeben (Position setzt app.js pro Frame).
         Bewusst OHNE transition: der Uebergang none->grayscale(1) interpoliert in Chromium nicht
         (bleibt bei 0 haengen). Toggle: Taste 's' oder Start mit ?bw. */
  body.bw #canvas-holder { filter: grayscale(1); }
  #canvas-holder { position: fixed; inset: 0; }
  canvas { display: block; }

  /* --- Hotspot-Tints (nur SW-Modus): weicher Gold-GLOW (screen-Blend, addiert Licht) ueber den
         sichtbaren Hotspot-Orbs und Rand-Markern — wirkt wie das Orb-Leuchten selbst. Bewusst
         NICHT color-Blend: der wuerde auf hellen Flaechen (Bimsstein) die ganze Kreisflaeche
         satt-gold faerben. Verwaltet updateBWTints() in app.js. --- */
  #bw-tints { position: fixed; inset: 0; pointer-events: none; z-index: 12; display: none; }
  #bw-tints div {
    position: absolute; border-radius: 50%; mix-blend-mode: screen;
    background: radial-gradient(circle, rgba(216,178,90,0.55) 0%, rgba(216,178,90,0.25) 40%, rgba(216,178,90,0) 68%);
  }

  /* --- Sonnenlicht-Tint (nur im SW-Modus sichtbar): ungefilterter Layer, der die Graustufen
         darunter per mix-blend-mode:color wieder gold faerbt. Position/Groesse setzt
         updateSunTint() in app.js pro Frame auf die sichtbare Sonne; in Szene 2 ein Band
         fuer das von oben einfallende Sonnenlicht. Helligkeit bleibt erhalten (color-Blend
         uebernimmt nur Farbton+Saettigung) -> dunkle Flaechen bleiben dunkel. --- */
  #sun-tint, #sun-tint-band {
    position: fixed; pointer-events: none; z-index: 12;
    mix-blend-mode: color; opacity: 0; transition: opacity 0.4s ease;
  }
  #sun-tint {
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,196,64,0.95) 0%, rgba(255,186,52,0.85) 40%, rgba(255,180,40,0) 70%);
  }
  #sun-tint-band {
    left: 0; top: 0; width: 100%;
    background: linear-gradient(180deg, rgba(255,196,64,0.9), rgba(255,196,64,0));
  }

  /* --- Glow-Cursor (DESCENT): kleiner Leuchtpunkt, waechst + waermt bei Hover, grau beim Greifen --- */
  #cursor {
    position: fixed; left: -100px; top: -100px; width: 10px; height: 10px;
    border-radius: 50%; background: rgba(232, 214, 164, 0.65);
    box-shadow: 0 0 12px rgba(216, 178, 90, 0.8);
    pointer-events: none; transform: translate(-50%, -50%); z-index: 1000;
    transition: width 0.18s, height 0.18s, background 0.18s;
  }
  #cursor.hover { width: 22px; height: 22px; background: rgba(255, 228, 170, 0.75); box-shadow: 0 0 22px rgba(255, 220, 150, 0.9); }
  #cursor.grab  { width: 16px; height: 16px; background: rgba(210, 200, 175, 0.5);  box-shadow: 0 0 14px rgba(216, 178, 90, 0.5); }

  /* --- Vignette (DESCENT): dunkle Raender, lenkt den Blick zur Mitte --- */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background: radial-gradient(ellipse at center, transparent 32%, rgba(0,0,0,0.35) 70%, rgba(0,0,0,0.9) 100%);
  }

  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.7; } }

  /* --- Start-Overlay (Browser-Autoplay-Policy: Audio erst nach Geste). DESCENT-Aufbau:
         Intro-Zeilen -> Welt-Zeile -> pulsierendes "click to enter" unten. --- */
  #gate {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: 12vh; background: #000;
    cursor: pointer; transition: opacity 1.5s ease; text-align: center;
  }
  #gate.hidden { opacity: 0; pointer-events: none; }
  #gate .intro { color: rgba(230, 224, 205, 0.95); font-size: 14px; letter-spacing: 0.16em; line-height: 2.2; max-width: 560px; margin: 0 2rem 42px; }
  #gate .world { color: rgba(216, 178, 90, 0.85); font-size: 11px; letter-spacing: 0.45em; text-transform: lowercase; margin-bottom: 50px; }
  #gate .text  { color: var(--dim); font-size: 13px; letter-spacing: 0.35em; text-transform: lowercase; animation: pulse 3s ease-in-out infinite; }

  /* --- Lade-/Statusanzeige --- */
  #status {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 45; color: var(--dim); letter-spacing: 0.35em; font-size: 12px;
    text-transform: lowercase; animation: pulse 3s ease-in-out infinite;
  }

  /* --- Reader-Overlay (DESCENT-Textpanel): Szene dimmt ab, Text zentriert in ruhiger Typo,
         optionales Bild darueber, "click to return" unten. Klick irgendwo schliesst. Ersetzt
         das fruehere Seiten-Panel UND die Callout-Etiketten. --- */
  #reader {
    position: fixed; inset: 0; z-index: 40;
    overflow-y: auto; background: rgba(0, 0, 4, 0.82);
    opacity: 0; pointer-events: none; transition: opacity 0.7s ease; cursor: pointer;
    scrollbar-width: thin; scrollbar-color: rgba(216, 178, 90, 0.3) transparent;
  }
  #reader.open { opacity: 1; pointer-events: all; }
  /* Wrapper zentriert kurzen Inhalt; langer Inhalt (Diagramm + Text) waechst nach unten und
     scrollt, statt oben abgeschnitten zu werden (klassisches min-height-Flex-Muster). */
  #reader-inner {
    min-height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 7vh 8vw 9vh;
  }
  /* Medienzone: Hotspot-Grafik + unterstuetzende Bilder (assets/images/hotspots/<id>1.png, ...).
     Ein Bild -> gross; mehrere -> nebeneinander, umbrechend. Leer -> Zone verschwindet. */
  #reader-media {
    display: flex; flex-wrap: wrap; gap: 2vw; align-items: center; justify-content: center;
    max-width: 90vw; margin-bottom: 4.5vh;
  }
  #reader-media:empty { display: none; }
  #reader-media img { max-height: 38vh; max-width: min(80vw, 880px); object-fit: contain; opacity: 0.92; }
  #reader h3 { font-weight: 400; color: var(--accent); font-size: 12px; letter-spacing: 0.42em; text-transform: lowercase; margin-bottom: 3.4vh; }
  #reader .body { color: var(--text); font-size: 15px; letter-spacing: 0.05em; line-height: 2.15; text-align: center; max-width: 660px; white-space: pre-wrap; }
  #reader a.link {
    display: none; margin-top: 3.5vh; color: var(--accent); text-decoration: none;
    border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: 0.2em; text-transform: lowercase;
  }
  #reader .hint {
    position: fixed; bottom: 3.4vh; left: 50%; transform: translateX(-50%);
    color: rgba(154, 147, 127, 0.55); font-size: 10px; letter-spacing: 0.42em; text-transform: lowercase;
  }

  /* --- In-Szene-Diagramm (#anno): KEIN Dim-Schleier — die echte Szene bleibt voll sichtbar,
         Linien/Labels beschriften sie direkt (SVG, von app.js gebaut und live verankert).
         Kurztext unten, eigene Bilder als Reihe darueber. DOM statt Canvas -> bleibt im
         SW-Modus ungefiltert (Diagramm bleibt gold). Voll klickbar (click to return). --- */
  #anno {
    position: fixed; inset: 0; z-index: 30; background: transparent;
    opacity: 0; pointer-events: none; transition: opacity 0.6s ease; cursor: pointer;
  }
  #anno.open { opacity: 1; pointer-events: all; }
  /* History-Diagramm: die Welt (Globus) bleibt dahinter sichtbar, wird aber leicht schwarz abgedunkelt. */
  #anno.bg-dim { background: rgba(0, 0, 4, 0.55); }
  #anno svg { position: absolute; inset: 0; }
  #anno-media {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 17vh;
    display: flex; gap: 1.5vw; align-items: flex-end; justify-content: center;
  }
  #anno-media:empty { display: none; }
  #anno-media img { max-height: 20vh; max-width: 30vw; object-fit: contain; opacity: 0.95; }
  #anno-caption {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 6.5vh;
    width: min(720px, 86vw); text-align: center;
    color: var(--text); font-size: 14px; letter-spacing: 0.05em; line-height: 1.9;
  }
  #anno .hint {
    position: absolute; bottom: 2.4vh; left: 50%; transform: translateX(-50%);
    color: rgba(154, 147, 127, 0.55); font-size: 10px; letter-spacing: 0.42em; text-transform: lowercase;
  }

  /* --- Szenen-Menue oben links (DESCENT): "i · the earth" usw., aktiver Eintrag mit Gold-Kante.
         Ersetzt die Punkte-Navigation; Pfeiltasten funktionieren weiter. --- */
  #scene-menu { position: fixed; top: 20px; left: 20px; z-index: 20; display: flex; flex-direction: column; gap: 8px; transition: opacity 0.6s ease; }
  .scene-btn {
    background: none; border: none; border-left: 2px solid transparent;
    color: rgba(154, 147, 127, 0.6); font-family: inherit; font-size: 13px;
    letter-spacing: 0.3em; text-transform: lowercase; cursor: pointer; text-align: left;
    padding: 4px 8px; transition: color 0.3s, border-color 0.3s, padding 0.3s;
  }
  .scene-btn:hover { color: rgba(228, 222, 204, 0.85); }
  .scene-btn.active { color: rgba(232, 214, 164, 0.9); border-left: 2px solid rgba(216, 178, 90, 0.55); padding-left: 12px; }

  #scene-name {
    position: fixed; left: 1.6rem; bottom: 1.5rem; z-index: 20;
    color: rgba(154, 147, 127, 0.7); letter-spacing: 0.35em; font-size: 11px; text-transform: lowercase;
    transition: opacity 0.6s ease;
  }
</style>
</head>
<body>
  <div id="canvas-holder"></div>
  <div id="status">loading …</div>

  <div id="gate" class="hidden">
    <div class="intro">an ocean planet under a sun no one may face.<br>a station of floating stone, breathing with the sea.<br><br>find the signals.&nbsp; listen.</div>
    <div class="world">solarspeculations&nbsp;·&nbsp;a world after the collapse</div>
    <div class="text">click to enter</div>
  </div>

  <div id="vignette"></div>
  <div id="sun-tint"></div>
  <div id="sun-tint-band"></div>
  <div id="bw-tints"></div>
  <div id="cursor"></div>

  <div id="reader" aria-hidden="true">
    <div id="reader-inner">
      <div id="reader-media"></div>
      <h3 id="reader-title"></h3>
      <div class="body" id="reader-body"></div>
      <a class="link" id="reader-link" href="#" target="_blank" rel="noopener"></a>
    </div>
    <div class="hint">click to return</div>
  </div>

  <div id="anno" aria-hidden="true">
    <svg id="anno-svg" font-family="'Courier New',monospace"></svg>
    <div id="anno-media"></div>
    <div id="anno-caption"></div>
    <div class="hint">click to return</div>
  </div>

  <nav id="scene-menu" aria-label="scenes"></nav>
  <div id="scene-name"></div>

  <script src="lib/p5.min.js"></script>
  <script src="lib/Tone.js"></script>
  <script src="app.js"></script>
</body>
</html>
